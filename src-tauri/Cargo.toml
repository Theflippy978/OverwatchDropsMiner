[package]
name = "overwatch-drops-miner"
version = "0.1.0"
description = "守望先锋直播掉宝助手"
authors = ["You"]
edition = "2021"

[lib]
name = "overwatch_drops_miner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
