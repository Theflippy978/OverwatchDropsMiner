name: Build & Release

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/build.yml'
      - 'requirements.txt'
      - 'build.py'
      - 'main.py'
      - 'overwatch_drops_miner/**'
      - 'img/app.ico'
  workflow_dispatch:
    inputs:
      release:
        description: '发布类型 (none=仅构建 / preview=预览版 pre-release / stable=正式版)'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - preview
          - stable
      tag:
        description: '正式版版本号 (如 v1.0.0)，仅 stable 需要'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Z-6：测试门禁——此前 23 个测试文件在 CI 中从未执行，
  # 测试红着也照常出包；现在构建必须先过全部单测。
  test:
    name: Run tests (pytest, offscreen Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system libraries for PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      update_channel: ${{ steps.version.outputs.update_channel }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Determine build version
        id: version
        shell: bash
        # workflow 输入经 env 间接引用（D-14），不再直接内插进 run 脚本；
        # tag 额外做白名单校验，杜绝 shell 元数据注入 runner。
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release_type="$RELEASE_INPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$release_type" = "stable" ]; then
            if [ -n "$TAG_INPUT" ]; then
              if ! printf '%s' "$TAG_INPUT" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
                echo "非法 tag：$TAG_INPUT" >&2
                exit 1
              fi
              version="$TAG_INPUT"
            else
              version="v$(date +%Y%m%d.%H%M%S)"
            fi
            update_channel="release"
            is_prerelease="false"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$release_type" = "preview" ]; then
            version="v${GITHUB_SHA::7}"
            update_channel="dev"
            is_prerelease="true"
          else
            version="dev-${GITHUB_SHA::7}"
            update_channel="dev"
            is_prerelease="false"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "update_channel=$update_channel" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows GUI (PyInstaller onefile)
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate version file
        shell: pwsh
        run: |
          @"
          APP_VERSION = "${{ needs.prepare.outputs.version }}"
          UPDATE_CHANNEL = "${{ needs.prepare.outputs.update_channel }}"
          REPOSITORY_URL = "https://github.com/mi0e/OverwatchDropsMiner"
          LATEST_RELEASE_API = "https://api.github.com/repos/mi0e/OverwatchDropsMiner/releases/latest"
          RELEASES_URL = "https://github.com/mi0e/OverwatchDropsMiner/releases/latest"
          "@ | Set-Content -Path "overwatch_drops_miner/_version.py" -Encoding UTF8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'build.py') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/OverwatchDropsMiner.exe" -DestinationPath "dist/OverwatchDropsMiner-win-${{ needs.prepare.outputs.version }}.zip" -CompressionLevel Fastest -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverwatchDropsMiner-win
          path: dist/OverwatchDropsMiner-win-*.zip
          retention-days: 30

  release:
    name: Publish release
    needs: [prepare, build-windows]
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.release == 'stable' || github.event.inputs.release == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OverwatchDropsMiner-win
          path: dist/
          merge-multiple: true

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.prepare.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ needs.prepare.outputs.version }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          files: dist/*.zip
