[pytest]
# 此前无此文件，testpaths 等全走 pytest 默认值 —— 默认会把仓库根
# （含 node_modules 与旧版残留模块）纳入收集范围。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra             : 失败时打印被跳过用例的原因摘要
# --strict-markers: 未注册的 marker 直接报错而非静默 skip，防止门禁 marker 写错而失效
# --tb=short      : 缩短回溯，日志可读性优先
addopts = -ra --strict-markers --tb=short

# 曾有 `asyncio_mode = auto`（pytest-asyncio 的配置），已连同该依赖一起删除：
# 本项目的 async 用例全部走 unittest.IsolatedAsyncioTestCase，不经过 pytest 的
# async 收集，所以那行没有作用，还会让每次跑测试都多一条
# "Unknown config option: asyncio_mode" 告警。
# 将来若真有人直接写 `async def test_*`，在没装插件时会**直接 FAILED**
# （"async def functions are not natively supported"）—— 响亮，不会静默漏过，
# 届时再按需装插件即可。

# 上游依赖内部产生的 DeprecationWarning，与本项目代码无关：
# Python 3.14 起 asyncio.TimeoutError 的别名迁移等
filterwarnings =
    ignore::DeprecationWarning:asyncio
    ignore::DeprecationWarning:pkg_resources
