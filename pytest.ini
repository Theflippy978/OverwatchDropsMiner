[pytest]
# 2026-10-02 新增 pytest 配置：此前无此文件，testpaths 等全走默认。
# 默认会把仓库根（含 node_modules 与旧版残留模块）纳入收集范围。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra            : 失败时打印被跳过用例的原因摘要，便于在 CI 上定位平台门禁
# --strict-markers : 未注册的 marker 直接报错而非静默 skip，防止门禁 marker 写错而失效
# --tb=short     : 缩短回溯，CI 日志可读性优先
#
# 刻意不加 --strict-config：pytest-asyncio 未安装时它会让 asyncio_mode 这项
# 配置直接报错退出，而不是告警后继续。告警即可定位，本地未装该依赖仍能跑测试。
addopts = -ra --strict-markers --tb=short

# pytest-asyncio 装在 requirements.txt。设为 auto 后 async def test_* 免 marker 生效，
# 否则严格模式下这类测试会被静默跳过而非失败 —— 缺依赖时的
# "Unknown config option: asyncio_mode" 告警不可忽略。
asyncio_mode = auto

# 上游依赖内部产生的 DeprecationWarning，与本项目代码无关：
# Python 3.14 起 asyncio.TimeoutError 的别名迁移等
filterwarnings =
    ignore::DeprecationWarning:asyncio
    ignore::DeprecationWarning:pkg_resources